[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "std-t98-cracker"
version = "0.2.0"
description = "STD-T98 standard and enhanced privacy analysis with solver-guided AI"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
ai = ["torch>=2", "safetensors>=0.4"]
dev = ["pytest>=7"]

[project.scripts]
std-t98-cracker = "std_t98_cracker.cli:main"

[tool.setuptools]
packages = ["std_t98_cracker"]

[tool.setuptools.package-data]
std_t98_cracker = ["*.dll", "*.so", "*.dylib", "models/*.json", "models/*.safetensors"]
